<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizar Laudo</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Segoe UI", Arial, sans-serif;
      background:#f4f7fb;
      color:#111827;
      padding:20px;
    }
    .box{
      max-width:700px;
      width:100%;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      box-shadow:0 18px 60px rgba(17,24,39,.10);
      padding:24px;
      text-align:center;
    }
    h1{
      margin:0 0 8px 0;
      font-size:24px;
      color:#0097CE;
    }
    p{
      margin:0 0 16px 0;
      color:#6b7280;
      line-height:1.5;
    }
    .status{
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      font-size:14px;
      background:#eef6fb;
      color:#0f4c5c;
      border:1px solid rgba(0,151,206,.18);
    }
    .erro{
      background:rgba(179,38,30,.08);
      color:#b3261e;
      border:1px solid rgba(179,38,30,.20);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Gerando laudo...</h1>
    <p>O PDF do ensaio está sendo preparado.</p>
    <div class="status" id="status">Aguarde um instante.</div>
  </div>

  <script>
    const API = "https://ensai-dieletrico.pedro-fillype.workers.dev";

    function setStatus(msg, isError = false){
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = isError ? "status erro" : "status";
    }

    function normalizar(str) {
      if (!str) return "";
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
    }

    function inicialRegional(regional){
      const r = normalizar(regional || "");
      if (r.includes("LESTE")) return "L";
      if (r.includes("CENTRO")) return "C";
      if (r.includes("OESTE")) return "O";
      return "X";
    }

    function limparNomeArquivo(s){
      return String(s || "")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[\\/:*?"<>|]/g, "-")
        .replace(/\s+/g, "_")
        .trim();
    }

    function montarNomeLaudo(e){
      const aprov = String(e.aprovacao || "");
      const partes = aprov.split("/");
      const numeroLaudo = (partes[0] || "").trim() || String(e.id || "").trim();
      const ano = (partes[1] || "").trim() || String(new Date(e.data || Date.now()).getFullYear());

      const ini = inicialRegional(e.regional);
      const equipamento = limparNomeArquivo(e.equipamentos || "EQUIPAMENTO");

      return `${ini}-${ano}-${numeroLaudo}-${equipamento}`;
    }

    async function gerarPDFPublico(e) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });

      const pageHeight = doc.internal.pageSize.getHeight();
      const pageWidth  = doc.internal.pageSize.getWidth();

      const meses = [
        "01 - JANEIRO","02 - FEVEREIRO","03 - MARÇO","04 - ABRIL",
        "05 - MAIO","06 - JUNHO","07 - JULHO","08 - AGOSTO",
        "09 - SETEMBRO","10 - OUTUBRO","11 - NOVEMBRO","12 - DEZEMBRO"
      ];

      let mes = "-";
      if (e.data) {
        const data = new Date(e.data + "T00:00:00");
        mes = meses[data.getMonth()];
      }

      doc.setFont("Helvetica", "bold");
      doc.setFontSize(16);
      doc.text("LAUDO DE ENSAIO DIELÉTRICO", pageWidth / 2, 16, { align: "center" });

      let y = 30;

      doc.autoTable({
        startY: y,
        tableWidth: 120,
        margin: { left: 14 },
        head: [["Laudo", "Valor"]],
        styles: { fontSize: 9 },
        body: [
          ["Laudo", "EPB/EBO"],
          ["Certificado nº", e.aprovacao || "-"],
          ["Mês do Ensaio", mes],
          ["Regional", e.regional || "-"],
          ["Localidade", e.localidade || "-"],
          ["Departamento", e.departamento || "-"]
        ]
      });

      y = doc.lastAutoTable.finalY + 8;

      doc.autoTable({
        startY: y,
        tableWidth: 120,
        margin: { left: 14 },
        head: [["Campo", "Valor"]],
        styles: { fontSize: 9 },
        body: [
          ["Equipamento", e.equipamentos || "-"],
          ["Tipo de Ensaio", e.tipo_ensaio || "-"],
          ["Norma Aplicada", e.norma || "-"]
        ]
      });

      y = doc.lastAutoTable.finalY + 8;

      const rows = [];
      const inicio = Number(e.cod_inicial);
      const fim = Number(e.cod_final);

      if (!Number.isNaN(inicio) && !Number.isNaN(fim)) {
        for (let i = inicio; i <= fim; i++) {
          rows.push([
            i,
            `${e.corrente_fuga || "-"} µA`,
            String(e.resultado || "").toUpperCase()
          ]);
        }
      }

      doc.autoTable({
        startY: y,
        head: [["Código Rastreamento", "Corrente de Fuga", "Resultado"]],
        styles: { fontSize: 9 },
        body: rows.length ? rows : [["-", "-", "-"]],
        margin: { left: 14, right: 14 }
      });

      y = doc.lastAutoTable.finalY + 8;

      doc.setFont("Helvetica", "bold");
      doc.text("Observações", 14, y);
      y += 6;

      doc.setFont("Helvetica", "bolditalic");
      doc.setFontSize(7.5);

      const obs = [
        "• Os EPI’s e EPC’s que estiverem com o código de rastreio e o ano de ensaio referente ao laudo técnico estão aprovados para uso em campo.",
        "• Ensaio de tensão aplicada: verifica se o equipamento suporta a tensão de ensaio em corrente alternada conforme sua classe de isolação.",
        "• Equipamentos utilizados para realização do teste: Testador de Alta Tensão Alternada marca EEAT.",
        "• Condições ambientais e demais critérios conforme procedimento interno aplicável."
      ];

      obs.forEach(l => {
        if (y > pageHeight - 30) {
          doc.addPage();
          y = 20;
        }
        doc.text(l, 14, y);
        y += 5;
      });

      if (y > pageHeight - 40) {
        doc.addPage();
        y = 30;
      }

      doc.text("__________________________________________", pageWidth / 2, y, { align: "center" });
      y += 6;

      doc.setFont("Helvetica", "bold");
      doc.text("Wesley Fernandes de Souza", pageWidth / 2, y, { align: "center" });
      y += 6;

      doc.setFont("Helvetica", "normal");
      doc.text("Responsável Técnico – CREA-PB: 1605187852", pageWidth / 2, y, { align: "center" });

      const nomeArquivo = montarNomeLaudo(e);
      doc.save(`${nomeArquivo}.pdf`);
    }

    async function iniciar(){
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        setStatus("ID do ensaio não informado na URL.", true);
        return;
      }

      try {
        const r = await fetch(`${API}/laudo-publico?id=${encodeURIComponent(id)}`);
        const j = await r.json().catch(() => ({}));

        if (!r.ok) {
          setStatus(j.error || "Erro ao buscar o laudo.", true);
          return;
        }

        setStatus("Dados carregados. Gerando PDF...");
        await gerarPDFPublico(j);
        setStatus("PDF gerado com sucesso.");
      } catch (err) {
        setStatus("Falha ao conectar ao servidor.", true);
      }
    }

    iniciar();
  </script>
</body>
</html>
